<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Responsive layout check</title><style>body{margin:0;font:16px/1.5 system-ui;background:#e9edf3;color:#17213b}header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:16px;background:white;border-bottom:1px solid #bac6d8}h1{font-size:18px;margin:0 20px 0 0}label{display:flex;align-items:center;gap:8px}select,a{font:inherit;min-height:44px}main{padding:20px;overflow:auto}iframe{display:block;border:1px solid #a3afc3;background:white;height:780px;max-width:none}a{display:inline-flex;align-items:center}</style></head><body><header><h1>Responsive layout check</h1><label>Page <select id="page"><option value="index.html">Railway explorer</option><option value="reading.html">Reading guide</option></select></label><label>Width <select id="width"><option>320</option><option selected>375</option><option>768</option><option>1280</option></select> CSS px</label><a id="open" href="../index.html" target="_blank" rel="noopener">Open page</a></header><main><iframe id="preview" width="375" title="Page at the selected viewport width" src="../index.html"></iframe></main><script>const page=document.getElementById('page'),width=document.getElementById('width'),preview=document.getElementById('preview'),openLink=document.getElementById('open');page.addEventListener('change',()=>{preview.src='../'+page.value;openLink.href=preview.src;});width.addEventListener('change',()=>{preview.width=width.value;});</script></body></html>
