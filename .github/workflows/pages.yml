name: Publish Railway Anatomy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and package the static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for checks
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check the static site
        run: node scripts/check-site.mjs

      - name: Build a cache-consistent release
        run: npm run build

      - name: Verify the release artifact
        run: npm run check:release

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false

      - name: Upload the deployable directory
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
